name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON -DOET_HOOK_TESTS=ON -DOET_FFM_TESTS=ON
          "-DJava_JAVA_EXECUTABLE=$env:JAVA_HOME/bin/java.exe"
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.configuration }}
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.configuration }} --output-on-failure --output-junit test-results.xml
      - name: Compile the installed C example
        shell: pwsh
        run: |
          cmake --install build/ci --config ${{ matrix.configuration }} --prefix out/install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S examples/c -B build/example -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$PWD/out/install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/example --config ${{ matrix.configuration }}
      - name: Package
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          cpack --config build/ci/CPackConfig.cmake -C Release -B out/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem out/packages -Filter '*.zip'
          if (@($zip).Count -ne 1) { throw 'Expected exactly one package' }
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath out/packages/SHA256SUMS -Value "$hash  $($zip.Name)" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.configuration == 'Release'
        with:
          name: windows-x64
          path: |
            out/packages/*.zip
            out/packages/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.configuration }}
          path: build/ci/test-results.xml
          if-no-files-found: warn
